name: lint

on:
  push:
  pull_request:

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: ShellCheck
        run: shellcheck scripts/*.sh

  sshd-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validar drop-ins com o sshd do runner
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq openssh-server
          sudo cp sshd_config.d/*.conf /etc/ssh/sshd_config.d/
          sudo cp templates/issue.net /etc/issue.net
          sudo groupadd -f ssh-users
          sudo sshd -t
          echo "sshd -t OK"
          sudo sshd -T | grep -E '^(permitrootlogin|passwordauthentication|kexalgorithms|ciphers|macs) '
