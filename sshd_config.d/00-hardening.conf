# =====================================================================
#  SSH_HARDENING_2026 — 00-hardening.conf
#  Destino: /etc/ssh/sshd_config.d/00-hardening.conf
#
#  O OpenSSH usa a PRIMEIRA ocorrência de cada diretiva. Por isso o
#  prefixo "00-": este arquivo é lido antes de qualquer outro drop-in
#  (ex.: 50-cloud-init.conf, que costuma reativar PasswordAuthentication).
#
#  Requer: OpenSSH >= 8.5 e a linha "Include /etc/ssh/sshd_config.d/*.conf"
#  no topo do /etc/ssh/sshd_config (padrão em Debian 12, Ubuntu 22.04+, RHEL 9).
#
#  SEMPRE: sshd -t  → valide antes de recarregar.
#  SEMPRE: mantenha uma sessão aberta enquanto testa uma nova conexão.
# =====================================================================

# --- 1. Superfície de rede -------------------------------------------
# Trocar a porta NÃO é controle de segurança: só reduz ruído de bots.
# Se trocar, libere no firewall ANTES e, no Ubuntu 22.10+, ajuste o ssh.socket.
#Port 22
#ListenAddress 10.0.0.10        # escute só na interface de gestão/VPN, se possível
AddressFamily inet              # use "any" se precisar de IPv6

# --- 2. Quem pode entrar ---------------------------------------------
PermitRootLogin no              # "prohibit-password" = root só por chave (ver docs/00)
AllowGroups ssh-users           # crie o grupo e adicione SÓ quem precisa
#AllowUsers nomeusuario admin backup   # alternativa: lista de usuários
#AllowUsers sl@10.0.0.0/24             # ou usuário + origem

# --- 3. Como pode entrar (somente chave) -----------------------------
PubkeyAuthentication yes
PasswordAuthentication no
KbdInteractiveAuthentication no # mude para "yes" apenas se usar 2FA (docs/2fa-totp.md)
PermitEmptyPasswords no
AuthenticationMethods publickey
UsePAM yes
AuthorizedKeysFile .ssh/authorized_keys

# --- 4. Limites contra força bruta e DoS -----------------------------
MaxAuthTries 3
LoginGraceTime 20
MaxStartups 10:30:60            # começa a descartar 30% após 10 conexões não autenticadas
MaxSessions 4

# --- 5. Sessões ociosas ----------------------------------------------
ClientAliveInterval 300
ClientAliveCountMax 2           # derruba após ~10 min sem resposta

# --- 6. Recursos que viram pivô (desligue o que não usa) -------------
X11Forwarding no
AllowAgentForwarding no
AllowTcpForwarding no           # use "local" se precisar de túneis -L
AllowStreamLocalForwarding no
PermitTunnel no
GatewayPorts no
PermitUserEnvironment no

# --- 7. Visibilidade (alimente seu SIEM) -----------------------------
LogLevel VERBOSE                # registra o fingerprint da chave usada no login
SyslogFacility AUTH
PrintLastLog yes
Banner /etc/issue.net

# --- 8. SFTP isolado (opcional) --------------------------------------
Subsystem sftp internal-sftp
#Match Group sftp-only
#    ChrootDirectory /srv/sftp/%u
#    ForceCommand internal-sftp
#    AllowTcpForwarding no
#    X11Forwarding no
