# =====================================================================
#  SSH_HARDENING_2026 — 10-crypto.conf
#  Destino: /etc/ssh/sshd_config.d/10-crypto.conf
#
#  Baseline para OpenSSH >= 8.5 (Debian 12, Ubuntu 22.04+, RHEL 9).
#  Um algoritmo desconhecido IMPEDE o sshd de subir — por isso o
#  scripts/apply-hardening.sh roda "sshd -t" antes de recarregar.
#
#  RHEL/Alma/Rocky: a criptografia é governada por crypto-policies.
#  Prefira "update-crypto-policies --set FUTURE" (ou um subpolicy)
#  em vez deste arquivo.
#
#  Confira o resultado com: ssh-audit <host>
# =====================================================================

# Chaves de host: só Ed25519 e RSA (>= 3072). Remova DSA/ECDSA.
HostKey /etc/ssh/ssh_host_ed25519_key
HostKey /etc/ssh/ssh_host_rsa_key

# Troca de chaves — sntrup761 é híbrido pós-quântico (OpenSSH >= 8.5).
# OpenSSH >= 9.9: adicione mlkem768x25519-sha256 no início da lista.
KexAlgorithms sntrup761x25519-sha512@openssh.com,curve25519-sha256,curve25519-sha256@libssh.org,diffie-hellman-group16-sha512,diffie-hellman-group18-sha512

# Cifras AEAD primeiro; CTR só por compatibilidade.
Ciphers chacha20-poly1305@openssh.com,aes256-gcm@openssh.com,aes128-gcm@openssh.com,aes256-ctr,aes192-ctr,aes128-ctr

# MACs apenas Encrypt-then-MAC.
MACs hmac-sha2-512-etm@openssh.com,hmac-sha2-256-etm@openssh.com,umac-128-etm@openssh.com

# Fora ssh-rsa (SHA-1).
HostKeyAlgorithms ssh-ed25519,ssh-ed25519-cert-v01@openssh.com,rsa-sha2-512,rsa-sha2-256
PubkeyAcceptedAlgorithms ssh-ed25519,ssh-ed25519-cert-v01@openssh.com,sk-ssh-ed25519@openssh.com,sk-ssh-ed25519-cert-v01@openssh.com,rsa-sha2-512,rsa-sha2-256

# Rotação de chave de sessão
RekeyLimit 1G 1h
